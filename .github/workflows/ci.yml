name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: nothing here needs to finish for an
# obsolete commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build, codec tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Compile the contracts and regenerate the ABIs
        run: bun run --cwd packages/contracts build

      # The generated ABIs are committed so the keeper and the app do not need a contracts
      # build. If a contract changed without them being regenerated, they have drifted.
      - name: Check the committed ABIs match the contracts
        run: git diff --exit-code -- packages/shared/src/generated/abis.ts

      - run: bun run typecheck
      - run: bun run --cwd packages/shared test
      - run: bun run --cwd packages/web lint

      - name: Build the front end
        env:
          NEXT_PUBLIC_REGISTRY_ADDRESS: "0x0000000000000000000000000000000000000000"
          NEXT_PUBLIC_MODULE_ADDRESS: "0x0000000000000000000000000000000000000000"
          NEXT_PUBLIC_SEPOLIA_RPC_URL: "https://ethereum-sepolia-rpc.publicnode.com"
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: "ci-placeholder"
        run: bun run --cwd packages/web build

  contracts:
    name: Contract tests against the local Nox stack
    runs-on: ubuntu-latest
    # The Nox plugin boots its offchain stack in Docker and the first run pulls the images,
    # so this is slower than everything else by a wide margin and gets its own job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run --cwd packages/contracts test
